<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // In the AI Studio sandboxed cloud container preview, Vite HMR is disabled by the platform
      // and updates are delivered on turn completion. We provide a clean WebSocket stub for "vite-hmr"
      // to gracefully satisfy Vite's internal module runner transport without emitting benign connection errors.
      (function() {
        if (typeof window !== 'undefined' && window.WebSocket) {
          var OrigWebSocket = window.WebSocket;
          window.WebSocket = function(url, protocols) {
            var isViteHmr = 
              (typeof protocols === 'string' && protocols === 'vite-hmr') ||
              (Array.isArray(protocols) && protocols.indexOf('vite-hmr') !== -1) ||
              (typeof url === 'string' && (url.indexOf('vite-hmr') !== -1 || (url.indexOf('token=') !== -1 && url.indexOf('/?') !== -1)));
            if (isViteHmr) {
              var listeners = { open: [], message: [], close: [], error: [] };
              return {
                readyState: 1, // OPEN
                binaryType: 'blob',
                bufferedAmount: 0,
                extensions: '',
                protocol: 'vite-hmr',
                url: String(url),
                addEventListener: function(event, cb) {
                  if (listeners[event]) listeners[event].push(cb);
                  if (event === 'open') {
                    setTimeout(function() { cb({ type: 'open' }); }, 0);
                  }
                },
                removeEventListener: function(event, cb) {
                  if (listeners[event]) {
                    listeners[event] = listeners[event].filter(function(fn) { return fn !== cb; });
                  }
                },
                dispatchEvent: function() { return true; },
                send: function() {},
                close: function() {
                  this.readyState = 3;
                  listeners.close.forEach(function(cb) { cb({ type: 'close' }); });
                }
              };
            }
            return new OrigWebSocket(url, protocols);
          };
          window.WebSocket.prototype = OrigWebSocket.prototype;
          window.WebSocket.CONNECTING = 0;
          window.WebSocket.OPEN = 1;
          window.WebSocket.CLOSING = 2;
          window.WebSocket.CLOSED = 3;
        }
      })();
    </script>
