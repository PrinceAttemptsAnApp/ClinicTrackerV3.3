name: Deploy DentaTrack

on:
push:
branches:
- main
workflow_dispatch:

permissions:
contents: read
pages: write
id-token: write

jobs:
build:
runs-on: ubuntu-latest
steps:
- uses: actions/checkout@v4

```
  - uses: oven-sh/setup-bun@v2

  - run: bun install

  - run: bun run build

  - uses: actions/configure-pages@v5

  - uses: actions/upload-pages-artifact@v3
    with:
      path: ./dist
```

deploy:
needs: build
runs-on: ubuntu-latest
environment:
name: github-pages
steps:
- id: deployment
uses: actions/deploy-pages@v4
